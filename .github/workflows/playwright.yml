name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install dependencies
      run: npm install -g pnpm && pnpm install
    - name: Set up MongoDB
      uses: supercharge/mongodb-github-action@1.10.0
      with:
        mongodb-version: '6.0'
    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install API dependencies
      run: |
        cd apps/api
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Start API server
      run: |
        sudo apt-get update && sudo apt-get install -y libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev shared-mime-info
        cd apps/api
        nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
        sleep 10
        curl -v http://127.0.0.1:8000/system/health || (cat uvicorn.log && exit 1)
      env:
        MONGO_URL: mongodb://localhost:27017
        DB_NAME: tac_pmc_crm_test
        JWT_SECRET_KEY: test_secret
        ENVIRONMENT: testing
    - name: Run Playwright tests
      run: pnpm exec playwright test
      env:
        NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:8000
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

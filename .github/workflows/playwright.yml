name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10.30.3
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'
    - name: Install Node dependencies
      run: pnpm install --frozen-lockfile
    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install API dependencies
      run: |
        cd apps/api
        python -m pip install --upgrade pip
        pip install --break-system-packages -r requirements.txt
    - name: Start API server
      run: |
        sudo apt-get update && sudo apt-get install -y libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev shared-mime-info
        cd apps/api
        # Bind to 0.0.0.0 so the API is reachable from both localhost and 127.0.0.1
        nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn.log 2>&1 &
        echo $! > /tmp/api.pid
        echo "Waiting for API to be ready..."
        for i in $(seq 1 60); do
          if curl -sf http://127.0.0.1:8000/docs > /dev/null 2>&1; then
            echo "✓ API is ready after ${i}s"
            break
          fi
          echo "  [$i/60] Not ready yet..."
          sleep 2
          if [ $i -eq 60 ]; then
            echo "❌ API failed to start within 120s"
            cat /tmp/uvicorn.log
            exit 1
          fi
        done
      env:
        MONGO_URL: mongodb://localhost:27017
        DB_NAME: tac_pmc_crm
        JWT_SECRET_KEY: test_secret_key_for_ci
        ENVIRONMENT: testing
        # Explicit CORS origins so allow_credentials=True works correctly with browsers.
        # The Next.js dev server runs on localhost:3000; without this, browsers reject
        # credentialled responses that carry Access-Control-Allow-Origin: *
        ALLOWED_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    - name: Seed test database
      run: |
        cd apps/api
        echo "🌱 Seeding test database..."
        MONGO_URL=mongodb://localhost:27017 DB_NAME=tac_pmc_crm python scripts/seed_production.py
        echo "✅ Seed script completed"
    - name: Verify database — users must exist
      run: |
        python - <<'EOF'
        import asyncio, sys
        from motor.motor_asyncio import AsyncIOMotorClient

        async def verify():
            client = AsyncIOMotorClient("mongodb://localhost:27017")
            db = client["tac_pmc_crm"]
            users = await db.users.find(
                {}, {"email": 1, "role": 1, "active_status": 1, "hashed_password": 1}
            ).to_list(20)
            client.close()
            print(f"\n=== DB VERIFICATION: tac_pmc_crm.users ({len(users)} docs) ===")
            if not users:
                print("❌ FATAL: No users found in database — seeding failed!")
                sys.exit(1)
            required = {
                "amit@thirdangleconcept.com", "admin@tacpmc.com",
                "client@tacpmc.com", "supervisor@tacpmc.com"
            }
            found = set()
            for u in users:
                email = u.get("email", "?")
                has_pw = bool(u.get("hashed_password"))
                active = u.get("active_status")
                role = u.get("role", "?")
                status = "✅" if has_pw and active else "❌"
                print(f"  {status} {email} | role={role} | active={active} | has_pw={has_pw}")
                found.add(email)
            missing = required - found
            if missing:
                print(f"\n❌ FATAL: Missing required users: {missing}")
                sys.exit(1)
            print("\n✅ All required users verified in database")

        asyncio.run(verify())
        EOF
    - name: Verify API authentication
      run: |
        echo "=== Testing login endpoint for all Playwright test users ==="
        FAILED=0

        check_login() {
          local EMAIL="$1"
          local PASS="$2"
          local LABEL="$3"
          HTTP_CODE=$(curl -s -o /tmp/login_resp_${LABEL}.json -w "%{http_code}" \
            -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${EMAIL}\",\"password\":\"${PASS}\"}")
          echo ""
          echo "--- ${LABEL}: ${EMAIL} ---"
          echo "HTTP Status: $HTTP_CODE"
          cat /tmp/login_resp_${LABEL}.json
          echo ""
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ FATAL: Login failed for ${EMAIL} (HTTP $HTTP_CODE)"
            FAILED=1
          else
            echo "✅ ${EMAIL} authenticated successfully"
          fi
        }

        # Verify every user the Playwright tests will exercise
        check_login "amit@thirdangleconcept.com" "Admin@1234"    "amit"
        check_login "admin@tacpmc.com"            "Admin@1234"    "admin"
        check_login "client@tacpmc.com"           "Client@1234"   "client"
        check_login "supervisor@tacpmc.com"       "Supervisor@1234" "supervisor"

        if [ "$FAILED" = "1" ]; then
          echo ""
          echo "=== API Server Logs ==="
          cat /tmp/uvicorn.log
          exit 1
        fi
        echo ""
        echo "✅ All API authentication checks passed"
    - name: Run Playwright tests
      run: pnpm exec playwright test
      env:
        CI: true
        NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:8000
    - name: Show API logs
      if: always()
      run: |
        echo "=== API Server Logs ==="
        tail -100 /tmp/uvicorn.log || echo "No API logs found"
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

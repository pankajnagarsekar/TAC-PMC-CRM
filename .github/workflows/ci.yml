name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  api:
    name: API — Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt
      - name: Lint (flake8)
        run: cd apps/api && python -m flake8 .
      - name: Test (pytest)
        run: cd apps/api && pytest tests/ -v
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: test_db
          JWT_SECRET_KEY: test-secret-key-for-ci
          ENVIRONMENT: development

  web:
    name: Web — Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint --filter=!@tac-pmc/api
      - run: cd apps/web && npx tsc --noEmit

  docker-api:
    name: Docker Build — API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t tac-pmc-api apps/api/

  test-e2e:
    name: E2E Tests — Playwright
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Python dependencies
        run: pip install -r apps/api/requirements.txt
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps
      - name: Create API health check script
        run: |
          cat > /tmp/api_health_check.sh << 'EOF'
          #!/bin/bash
          while true; do
            if ! curl -sf http://localhost:8000/docs > /dev/null 2>&1; then
              echo "❌ API health check failed!"
              exit 1
            fi
            sleep 5
          done
          EOF
          chmod +x /tmp/api_health_check.sh
      - name: Start API server
        run: |
          cd apps/api
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/api.log 2>&1 &
          API_PID=$!
          echo $API_PID > /tmp/api.pid
          echo "API server started with PID: $API_PID"
          sleep 2
          if ! kill -0 $API_PID 2>/dev/null; then
            echo "❌ API server failed to start"
            cat /tmp/api.log
            exit 1
          fi
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: test_db
          JWT_SECRET_KEY: test-secret-key-for-ci
          ENVIRONMENT: development
      - name: Wait for API to be ready
        run: |
          echo "Waiting for API server to be healthy..."
          for i in {1..60}; do
            if curl -sf http://localhost:8000/docs > /dev/null 2>&1; then
              echo "✓ API server is healthy and ready!"
              break
            fi
            echo "[$i/60] API server not ready, retrying in 2 seconds..."
            sleep 2
            if [ $i -eq 60 ]; then
              echo "❌ API server failed to become ready within 120 seconds"
              if [ -f /tmp/api.log ]; then
                echo "=== API Logs ==="
                cat /tmp/api.log
              fi
              exit 1
            fi
          done
      - name: Start API health monitoring (background)
        run: |
          bash /tmp/api_health_check.sh > /tmp/api_monitor.log 2>&1 &
          MONITOR_PID=$!
          echo $MONITOR_PID > /tmp/monitor.pid
          echo "Health monitor started with PID: $MONITOR_PID"
      - name: Seed test database
        run: cd apps/api && python scripts/seed_production.py
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: test_db
      - name: Run Playwright tests
        run: pnpm test:e2e
        env:
          CI: true
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: test_db
      - name: Check API health after tests
        if: always()
        run: |
          API_PID=$(cat /tmp/api.pid)
          if kill -0 $API_PID 2>/dev/null; then
            echo "✓ API server is still running"
          else
            echo "❌ API server crashed during test execution"
            if [ -f /tmp/api.log ]; then
              echo "=== API Logs ==="
              tail -100 /tmp/api.log
            fi
            exit 1
          fi
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  docker-web:
    name: Docker Build — Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Web image
        run: docker build -t tac-pmc-web --build-arg NEXT_PUBLIC_BACKEND_URL=https://placeholder.onrender.com -f apps/web/Dockerfile .
